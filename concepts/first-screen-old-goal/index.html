<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>first-screen-old-goal</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#d4ffa2" />
<style>
  @font-face {
    font-family: "Oceanic Text Mono";
    src: url("assets/fonts/OceanicTextMono-Regular.otf") format("opentype");
    font-weight: 400;
    font-display: block;
  }
  @font-face {
    font-family: "SF Pro Text";
    src: url("assets/fonts/SFProText-Regular.otf") format("opentype");
    font-weight: 400;
    font-display: block;
  }
  @font-face {
    font-family: "SF Pro Text";
    src: url("assets/fonts/SFProText-Semibold.otf") format("opentype");
    font-weight: 590;
    font-display: block;
  }
  @font-face {
    font-family: "ABC Diatype Variable";
    src: url("assets/fonts/ABCDiatypeVariable.ttf") format("truetype");
    font-weight: 100 900;
    font-display: block;
  }

  :root {
    --w: 402px;
    --h: 874px;
    --sheet-h: 681px;
    --green: #d4ffa2;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    background: #16151a;
    overflow: hidden;
    user-select: none;
    touch-action: none;
    overscroll-behavior: none;
  }
  body { display: grid; place-items: center; }

  .stage {
    position: relative;
    width: var(--w);
    height: var(--h);
    transform-origin: center center;
  }

  .frame {
    position: relative;
    width: var(--w);
    height: var(--h);
    overflow: hidden;
    background: #000;
  }

  /* ---- layer under the sheet ---- */
  .under {
    position: absolute;
    left: 0;
    top: 0;
    width: var(--w);
    height: var(--sheet-h);
    background: #000;
  }
  .under p {
    position: absolute;
    left: 15px;
    top: 141px;
    width: 371px;
    margin: 0;
    font-family: "Oceanic Text Mono";
    font-size: 54px;
    line-height: 59px;
    color: #fff;
  }

  /* ---- the peeling sheet ---- */
  .sheet {
    position: absolute;
    left: 0;
    top: 0;
    width: var(--w);
    height: var(--sheet-h);
    overflow: hidden;
    z-index: 1;
  }

  .front {
    position: absolute;
    inset: 0;
    background: var(--green);
  }

  .flap {
    position: absolute;
    left: 0;
    top: 0;
    width: var(--w);
    height: var(--sheet-h);
    display: block;
    pointer-events: none;
  }

  /* phrase — frame 14,125,372,487 */
  .phrase {
    position: absolute;
    left: 14px;
    top: 125px;
    width: 372px;
    height: 487px;
    overflow: hidden;
  }
  .phrase p {
    position: absolute;
    left: 1px;
    top: 16px;
    width: 371px;
    margin: 0;
    font-family: "Oceanic Text Mono";
    font-size: 54px;
    line-height: 59px;
    color: #000;
  }
  .phrase .line {
    position: absolute;
    left: 1px;
    height: 1px;
    display: block;
  }
  .phrase .line img { display: block; width: 100%; height: 1px; }

  /* ---- chrome that stays on screen while the page peels ---- */
  .chrome {
    position: absolute;
    left: 0;
    top: 0;
    width: var(--w);
    height: var(--sheet-h);
    z-index: 20;
    pointer-events: none;
  }
  .chrome .time,
  .chrome .status-row p,
  .chrome .status-row .rule,
  .chrome .levels img,
  .chrome .menu img {
    transition: color 260ms ease, background-color 260ms ease, filter 260ms ease;
  }
  /* Figma covers only the green sheet; on the black slide the chrome inverts */
  .chrome.on-dark .time,
  .chrome.on-dark .status-row p { color: #fff; }
  .chrome.on-dark .status-row .rule { background: rgba(255, 255, 255, 0.3); }
  .chrome.on-dark .levels img,
  .chrome.on-dark .menu img { filter: invert(1); }

  /* status bar — frame 0,0,402,62 */
  .time {
    position: absolute;
    left: 24px;
    top: 21px;
    width: 100px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: 1.5px;
    font-family: "SF Pro Text";
    font-weight: 590;
    font-size: 17px;
    line-height: 22px;
    color: #000;
  }
  .levels {
    position: absolute;
    left: 278px;
    top: 21px;
    width: 100px;
    height: 22px;
  }
  .levels img { display: block; width: 100px; height: 22px; }
  .island {
    position: absolute;
    left: 139px;
    top: 14px;
    width: 124px;
    height: 36px;
    border-radius: 30.631px;
    background: #000;
  }

  /* menu icon — frame 16,69,40,5 */
  .menu {
    position: absolute;
    left: 16px;
    top: 69px;
    width: 40px;
    height: 5px;
  }
  .menu img {
    position: absolute;
    left: 0;
    top: -3px;
    width: 40px;
    height: 8px;
    display: block;
  }

  /* status — frame 15,98,126,23 */
  .status-row {
    position: absolute;
    left: 15px;
    top: 98px;
    width: 126px;
    height: 23px;
    overflow: hidden;
  }
  .status-row .rule {
    position: absolute;
    left: 1px;
    top: 22px;
    width: 115px;
    height: 1px;
    background: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(14.4px);
    -webkit-backdrop-filter: blur(14.4px);
  }
  .status-row p {
    position: absolute;
    left: -1px;
    top: 0;
    margin: 0;
    width: 119px;
    height: 20px;
    white-space: nowrap;
    color: #000;
    font-size: 0;
  }
  .status-row .sym {
    font-family: "SF Pro Text";
    font-weight: 400;
    font-size: 14px;
    line-height: 20px;
  }
  .status-row .sp {
    font-family: "SF Pro Text";
    font-weight: 400;
    font-size: 18px;
    line-height: 20px;
  }
  .status-row .txt {
    font-family: "ABC Diatype Variable";
    font-weight: 400;
    font-size: 18px;
    line-height: 20px;
  }

  /* input — frame -3,681,405,203 */
  .input {
    position: absolute;
    left: -3px;
    top: 681px;
    width: 405px;
    height: 203px;
    background: #fff;
    overflow: hidden;
    z-index: 15;
  }
  .input .placeholder {
    position: absolute;
    left: 23px;
    top: 20px;
    width: 144px;
    height: 31px;
    margin: 0;
    font-family: "Oceanic Text Mono";
    font-size: 25px;
    line-height: 31px;
    letter-spacing: -0.75px;
    color: rgba(0, 0, 0, 0.12);
    white-space: nowrap;
  }
  .input .caret {
    position: absolute;
    left: 19px;
    top: 20px;
    width: 1px;
    height: 35px;
    background: #000;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .input .plus {
    position: absolute;
    left: 32px;
    top: 126px;
    width: 20px;
    height: 20px;
  }
  .input .plus img { display: block; width: 20px; height: 20px; }
  .input .ring {
    position: absolute;
    top: 113px;
    width: 46px;
    height: 46px;
  }
  .input .ring img { display: block; width: 46px; height: 46px; }
  .input .ring.l { left: 19px; }
  .input .ring.r { left: 343px; }
  .input .wave { position: absolute; display: block; }
  .input .wave img { display: block; width: 1px; height: 100%; }

  .caption {
    position: absolute;
    left: 50%;
    top: calc(100% + 18px);
    transform: translateX(-50%);
    white-space: nowrap;
    font-family: "ABC Diatype Variable", system-ui, sans-serif;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.28);
  }

  @media (max-width: 430px) {
    .caption { display: none; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="frame">
      <div class="under" id="under">
        <p>Lisbon,<br />the trip<br />you keep<br />postponing</p>
      </div>

      <div class="sheet" id="sheet">
        <div class="front" id="front">
          <div class="phrase">
            <p>This is<br />your old<br />goal, which<br />I think<br />you have<br />forgotten</p>
            <div class="line" style="top:68px;width:225px"><img src="assets/line-108.svg" alt="" /></div>
            <div class="line" style="top:130px;width:260px"><img src="assets/line-109.svg" alt="" /></div>
            <div class="line" style="top:188px;width:355px"><img src="assets/line-110.svg" alt="" /></div>
            <div class="line" style="top:248px;width:225px"><img src="assets/line-111.svg" alt="" /></div>
            <div class="line" style="top:307px;width:255px"><img src="assets/line-113.svg" alt="" /></div>
            <div class="line" style="top:370px;width:291px"><img src="assets/line-114.svg" alt="" /></div>
          </div>
        </div>
        <canvas class="flap" id="flap"></canvas>
      </div>

      <div class="chrome" id="chrome">
        <div class="time">9:41</div>
        <div class="island"></div>
        <div class="levels"><img src="assets/levels.svg" alt="" width="100" height="22" /></div>
        <div class="menu"><img src="assets/menu.svg" alt="" width="40" height="8" /></div>
        <div class="status-row">
          <p><span class="sym">&#x1003C6;</span><span class="sp">&nbsp;</span><span class="txt">your photos</span></p>
          <div class="rule"></div>
        </div>
      </div>

      <div class="input">
        <p class="placeholder">Start chat</p>
        <div class="caret"></div>
        <div class="ring l"><img src="assets/circle-left.svg" alt="" width="46" height="46" /></div>
        <div class="plus"><img src="assets/plus.svg" alt="" width="20" height="20" /></div>
        <div class="ring r"><img src="assets/circle-right.svg" alt="" width="46" height="46" /></div>
        <div class="wave" style="left:356px;top:133px;height:6px"><img src="assets/wave-2.svg" alt="" /></div>
        <div class="wave" style="left:363px;top:129px;height:14px"><img src="assets/wave-1.svg" alt="" /></div>
        <div class="wave" style="left:370px;top:132px;height:8px"><img src="assets/wave-3.svg" alt="" /></div>
        <div class="wave" style="left:376px;top:134px;height:4px"><img src="assets/wave-4.svg" alt="" /></div>
      </div>
    </div>
    <div class="caption">iPhone 17 · 402 × 874</div>
  </div>

<script>
(() => {
  const W = 402;
  const H = 681;
  const CX = W;
  const CY = H;
  const SUM = W + H;

  // the fold runs at 45°, so both legs of the corner are always equal
  const DX = -Math.SQRT1_2;
  const DY = -Math.SQRT1_2;
  const REST_L = 40;
  const GONE_L = SUM + 80;
  // it slides away on its own only once the page is nearly gone
  const OPEN_AREA = 0.1 * W * H;

  const stage = document.getElementById("stage");
  const sheet = document.getElementById("sheet");
  const front = document.getElementById("front");
  const chrome = document.getElementById("chrome");
  const under = document.getElementById("under");
  const canvas = document.getElementById("flap");
  const ctx = canvas.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, 3);

  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  function fit() {
    const pad = window.innerWidth <= 430 ? 0 : 80;
    const s = Math.min((window.innerWidth - pad) / 402, (window.innerHeight - pad) / 874, 1);
    stage.style.transform = `scale(${s})`;
  }
  fit();
  window.addEventListener("resize", fit);

  const SHEET = [[0, 0], [W, 0], [W, H], [0, H]];

  function clipHalf(poly, mx, my, nx, ny, keepPositive) {
    const sign = keepPositive ? 1 : -1;
    const f = (p) => sign * ((p[0] - mx) * nx + (p[1] - my) * ny);
    const out = [];
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i];
      const b = poly[(i + 1) % poly.length];
      const fa = f(a);
      const fb = f(b);
      if (fa >= 0) out.push(a);
      if ((fa >= 0) !== (fb >= 0)) {
        const t = fa / (fa - fb);
        out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
      }
    }
    return out;
  }

  function reflect(p, mx, my) {
    const d = (p[0] - mx) * DX + (p[1] - my) * DY;
    return [p[0] - 2 * d * DX, p[1] - 2 * d * DY];
  }

  function polyArea(p) {
    let a = 0;
    for (let i = 0; i < p.length; i++) {
      const q = p[(i + 1) % p.length];
      a += p[i][0] * q[1] - q[0] * p[i][1];
    }
    return Math.abs(a) / 2;
  }

  // L is the length of each leg of the folded corner
  function paint(L) {
    if (L < 1) {
      front.style.clipPath = "none";
      ctx.clearRect(0, 0, W, H);
      return W * H;
    }

    const mx = CX - L / 2;
    const my = CY - L / 2;
    const nx = -L;
    const ny = -L;

    const keep = clipHalf(SHEET, mx, my, nx, ny, true);
    const folded = clipHalf(SHEET, mx, my, nx, ny, false);

    front.style.clipPath = keep.length < 3
      ? "polygon(0px 0px, 0px 0px, 0px 0px)"
      : "polygon(" + keep.map((p) => `${p[0]}px ${p[1]}px`).join(", ") + ")";

    ctx.clearRect(0, 0, W, H);
    if (folded.length >= 3) {
      const flap = folded.map((p) => reflect(p, mx, my));
      ctx.beginPath();
      ctx.moveTo(flap[0][0], flap[0][1]);
      for (let i = 1; i < flap.length; i++) ctx.lineTo(flap[i][0], flap[i][1]);
      ctx.closePath();
      const span = Math.min(320, Math.max(64, L * 1.3));
      const g = ctx.createLinearGradient(mx, my, mx + DX * span, my + DY * span);
      g.addColorStop(0, "#fbfbf9");
      g.addColorStop(1, "#dcdcd6");
      ctx.fillStyle = g;
      ctx.fill();
    }

    return keep.length < 3 ? 0 : polyArea(keep);
  }

  let fold = REST_L;
  let grabL = REST_L;
  let grabU = 0;
  let dragging = false;
  let opened = false;
  let anim = null;

  paint(fold);

  function animate(to, ms, done) {
    const from = fold;
    const t0 = performance.now();
    if (anim) cancelAnimationFrame(anim);
    function step(now) {
      const t = Math.min(1, (now - t0) / ms);
      const e = 1 - Math.pow(1 - t, 3);
      fold = from + (to - from) * e;
      paint(fold);
      if (t < 1) anim = requestAnimationFrame(step);
      else if (done) done();
    }
    anim = requestAnimationFrame(step);
  }

  function open() {
    dragging = false;
    opened = true;
    sheet.style.pointerEvents = "none";
    chrome.classList.add("on-dark");
    animate(GONE_L, 540);
  }

  function close() {
    opened = false;
    sheet.style.pointerEvents = "";
    chrome.classList.remove("on-dark");
    animate(REST_L, 520);
  }

  function local(e) {
    const r = sheet.getBoundingClientRect();
    return {
      x: ((e.clientX - r.left) / r.width) * W,
      y: ((e.clientY - r.top) / r.height) * H
    };
  }

  sheet.addEventListener("pointerdown", (e) => {
    if (opened) return;
    const p = local(e);
    if (Math.hypot(p.x - (CX - fold), p.y - (CY - fold)) > 92 &&
        Math.hypot(p.x - CX, p.y - CY) > 100) return;
    e.preventDefault();
    dragging = true;
    grabL = fold;
    grabU = p.x + p.y;
    sheet.setPointerCapture?.(e.pointerId);
    if (anim) cancelAnimationFrame(anim);
  });

  sheet.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    e.preventDefault();
    const p = local(e);
    // the crease tracks the finger along the 45° axis, so the corner stays square
    fold = Math.min(SUM, Math.max(0, grabL + grabU - (p.x + p.y)));
    if (paint(fold) <= OPEN_AREA) open();
  });

  function release() {
    if (!dragging) return;
    dragging = false;
    close();
  }

  sheet.addEventListener("pointerup", release);
  sheet.addEventListener("pointercancel", release);

  under.addEventListener("pointerdown", () => {
    if (opened) close();
  });
})();
</script>
<script src="../shared/touch-cursor.js" data-target=".frame"></script>
</body>
</html>
