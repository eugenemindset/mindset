<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Scratch panel</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0c0b10" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --frame-w: 402px;
    --frame-h: 874px;
    --screen: #0c0b10;
    --cream: #f3eee4;
    --muted: rgba(243, 238, 228, 0.42);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    background: #16151a;
    color: var(--cream);
    font-family: Outfit, system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    touch-action: none;
    overscroll-behavior: none;
  }

  body {
    display: grid;
    place-items: center;
  }

  .stage {
    position: relative;
    width: var(--frame-w);
    height: var(--frame-h);
    transform-origin: center center;
  }

  .frame {
    position: relative;
    width: var(--frame-w);
    height: var(--frame-h);
    border-radius: 54px;
    overflow: hidden;
    background: var(--screen);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.06),
      0 28px 80px rgba(0, 0, 0, 0.55);
    touch-action: none;
  }

  .grain {
    pointer-events: none;
    position: absolute;
    inset: 0;
    opacity: 0.07;
    z-index: 8;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .island {
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 126px;
    height: 37px;
    background: #000;
    border-radius: 19px;
    z-index: 20;
  }

  .status {
    position: absolute;
    top: 18px;
    left: 0;
    right: 0;
    z-index: 19;
    display: flex;
    justify-content: space-between;
    padding: 0 28px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .status-right {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .bar {
    display: inline-block;
    width: 17px;
    height: 10px;
    border: 1.2px solid rgba(243, 238, 228, 0.9);
    border-radius: 2.5px;
    position: relative;
  }
  .bar::after {
    content: "";
    position: absolute;
    inset: 1.5px 1.5px 1.5px 4px;
    background: var(--cream);
    border-radius: 1px;
  }
  .bar::before {
    content: "";
    position: absolute;
    right: -3px;
    top: 2.5px;
    width: 1.5px;
    height: 5px;
    background: rgba(243, 238, 228, 0.9);
    border-radius: 1px;
  }

  .card {
    position: absolute;
    left: 32px;
    top: 78px;
    width: 338px;
    height: 680px;
    border-radius: 28px;
    overflow: hidden;
    background:
      radial-gradient(120% 80% at 50% 30%, #2a261f 0%, #14120f 55%, #0e0c0a 100%);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
    z-index: 3;
    cursor: none;
  }

  .reveal {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 32px;
  }

  .reveal em {
    display: block;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 72px;
    line-height: 0.9;
    letter-spacing: -0.03em;
    color: var(--cream);
  }

  .reveal span {
    display: block;
    margin-top: 18px;
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(243, 238, 228, 0.45);
  }

  .foil {
    position: absolute;
    inset: 0;
    width: 338px;
    height: 680px;
    display: block;
  }

  .particles {
    position: absolute;
    inset: 0;
    width: 402px;
    height: 874px;
    display: block;
    z-index: 6;
    pointer-events: none;
  }

  .hint {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 42px;
    z-index: 7;
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  .hint button {
    appearance: none;
    border: 0;
    background: none;
    color: rgba(243, 238, 228, 0.72);
    font: inherit;
    letter-spacing: 0.08em;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .home {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.28);
    z-index: 20;
  }

  .coin {
    position: fixed;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 40;
    transform: translate(-100px, -100px);
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.55), rgba(255,255,255,0.12) 55%, rgba(255,255,255,0.04));
    box-shadow: 0 0 0 1px rgba(255,255,255,0.2), 0 8px 20px rgba(0,0,0,0.25);
    opacity: 0;
    transition: opacity 120ms ease;
  }
  .coin.on { opacity: 1; }

  .caption {
    position: absolute;
    left: 50%;
    top: calc(100% + 18px);
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.28);
    pointer-events: none;
  }

  @media (max-width: 430px) {
    body { background: var(--screen); }
    .frame { border-radius: 0; box-shadow: none; }
    .caption { display: none; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="frame" id="frame">
      <div class="status">
        <span>9:41</span>
        <span class="status-right"><span class="bar"></span></span>
      </div>
      <div class="island"></div>

      <div class="card" id="card">
        <div class="reveal">
          <div>
            <em>hello</em>
            <span>просто текст</span>
          </div>
        </div>
        <canvas class="foil" id="foil"></canvas>
      </div>

      <canvas class="particles" id="particles"></canvas>
      <div class="grain"></div>
      <div class="hint">трите пальцем или курсором · <button type="button" id="reset">заново</button></div>
      <div class="home"></div>
    </div>
    <div class="caption">iPhone 17 · 402 × 874</div>
  </div>
  <div class="coin" id="coin"></div>

<script>
(() => {
  const FRAME_W = 402;
  const FRAME_H = 874;
  const CARD_W = 338;
  const CARD_H = 680;
  const CARD_X = 32;
  const CARD_Y = 78;
  const CELL = 8;
  const BRUSH = 20;
  const MAX_PARTICLES = 340;

  const dpr = Math.min(window.devicePixelRatio || 1, 3);

  const stage = document.getElementById("stage");
  const frame = document.getElementById("frame");
  const card = document.getElementById("card");
  const foilEl = document.getElementById("foil");
  const particleEl = document.getElementById("particles");
  const coin = document.getElementById("coin");
  const resetBtn = document.getElementById("reset");

  function fit() {
    const pad = window.innerWidth <= 430 ? 0 : 80;
    const s = Math.min(
      (window.innerWidth - pad) / FRAME_W,
      (window.innerHeight - pad) / FRAME_H,
      1
    );
    stage.style.transform = `scale(${s})`;
  }
  fit();
  window.addEventListener("resize", fit);

  function prep(canvas, w, h) {
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    const ctx = canvas.getContext("2d", { alpha: true });
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return ctx;
  }

  function offscreen(w, h) {
    const c = document.createElement("canvas");
    c.width = Math.round(w * dpr);
    c.height = Math.round(h * dpr);
    const ctx = c.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { canvas: c, ctx };
  }

  const foilCtx = prep(foilEl, CARD_W, CARD_H);
  const pCtx = prep(particleEl, FRAME_W, FRAME_H);
  const texture = offscreen(CARD_W, CARD_H);
  const maskTop = offscreen(CARD_W, CARD_H);
  const maskUnder = offscreen(CARD_W, CARD_H);
  const layer = offscreen(CARD_W, CARD_H);

  const FLAKE_COLORS = ["#e7edf4", "#c5ced8", "#9aa7b4", "#d9c4ee", "#b7e0f4", "#efe3c4", "#ffffff"];

  function paintTexture() {
    const ctx = texture.ctx;
    const w = CARD_W;
    const h = CARD_H;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    const base = ctx.createLinearGradient(0, 0, w, h);
    base.addColorStop(0, "#dfe4ea");
    base.addColorStop(0.45, "#bdc5ce");
    base.addColorStop(1, "#d4dae2");
    ctx.fillStyle = base;
    ctx.fillRect(0, 0, w, h);

    for (let x = 0; x < w; x++) {
      const v = 168 + Math.random() * 72;
      ctx.fillStyle = `rgba(${v}, ${v + 5}, ${v + 10}, ${0.12 + Math.random() * 0.22})`;
      ctx.fillRect(x, 0, 1, h);
    }

    const blobs = [
      [190, 0.22], [280, 0.18], [40, 0.14], [320, 0.16], [200, 0.12]
    ];
    for (let i = 0; i < 16; i++) {
      const [hue, a] = blobs[i % blobs.length];
      const cx = Math.random() * w;
      const cy = Math.random() * h;
      const r = 50 + Math.random() * 110;
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      g.addColorStop(0, `hsla(${hue}, 72%, 72%, ${a})`);
      g.addColorStop(1, "hsla(0,0%,0%,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const img = ctx.getImageData(0, 0, texture.canvas.width, texture.canvas.height);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const n = (Math.random() - 0.5) * 28;
      d[i] = Math.max(0, Math.min(255, d[i] + n));
      d[i + 1] = Math.max(0, Math.min(255, d[i + 1] + n));
      d[i + 2] = Math.max(0, Math.min(255, d[i + 2] + n));
    }
    ctx.putImageData(img, 0, 0);
    ctx.restore();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.save();
    ctx.globalAlpha = 0.05;
    ctx.strokeStyle = "#1a1a1a";
    ctx.lineWidth = 1;
    for (let i = -h; i < w; i += 7) {
      ctx.beginPath();
      ctx.moveTo(i, 0);
      ctx.lineTo(i + h, h);
      ctx.stroke();
    }
    ctx.restore();

    const sheen = ctx.createLinearGradient(0, 0, w, h);
    sheen.addColorStop(0, "rgba(255,255,255,0.42)");
    sheen.addColorStop(0.45, "rgba(255,255,255,0)");
    sheen.addColorStop(1, "rgba(0,0,0,0.08)");
    ctx.fillStyle = sheen;
    ctx.fillRect(0, 0, w, h);
  }

  function fillMask(m) {
    m.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    m.ctx.globalCompositeOperation = "source-over";
    m.ctx.globalAlpha = 1;
    m.ctx.fillStyle = "#fff";
    m.ctx.fillRect(0, 0, CARD_W, CARD_H);
  }

  function resetMask() {
    fillMask(maskTop);
    fillMask(maskUnder);
  }

  paintTexture();
  resetMask();

  function makeGrid(ox, oy) {
    const cols = Math.ceil(CARD_W / CELL) + 1;
    const rows = Math.ceil(CARD_H / CELL) + 1;
    const grid = new Array(rows);
    let alive = 0;
    for (let r = 0; r < rows; r++) {
      const row = grid[r] = new Array(cols);
      for (let c = 0; c < cols; c++) {
        const cx = ox + c * CELL + CELL * 0.5 + (Math.random() - 0.5) * 2.4;
        const cy = oy + r * CELL + CELL * 0.5 + (Math.random() - 0.5) * 2.4;
        const n = 5 + (Math.random() * 3 | 0);
        const rot = Math.random() * Math.PI;
        const poly = [];
        for (let i = 0; i < n; i++) {
          const a = rot + (i / n) * Math.PI * 2 + (Math.random() - 0.5) * 0.32;
          const rad = CELL * (0.7 + Math.random() * 0.52);
          poly.push([
            cx + Math.cos(a) * rad,
            cy + Math.sin(a) * rad * (0.72 + Math.random() * 0.42)
          ]);
        }
        row[c] = { cx, cy, poly, alive: true };
        alive++;
      }
    }
    return { grid, rows, cols, alive, total: alive };
  }

  let top = makeGrid(0, 0);
  let under = makeGrid(CELL * 0.45, CELL * 0.4);

  function buildFrags() {
    top = makeGrid(0, 0);
    under = makeGrid(CELL * 0.45, CELL * 0.4);
  }

  const particles = [];
  let lastX = null;
  let lastY = null;
  let scratching = false;
  let crumbled = false;
  let didScratch = false;
  let checkIn = 0;
  let strokeSeen = new Set();

  function spawn(x, y, ux, uy, burst = false) {
    if (particles.length >= MAX_PARTICLES) particles.splice(0, 20);
    const speed = burst ? 1.2 + Math.random() * 3.4 : 0.6 + Math.random() * 2.2;
    const drift = (Math.random() - 0.5) * (burst ? 2.2 : 1.3);
    particles.push({
      x: CARD_X + x,
      y: CARD_Y + y,
      vx: (ux || 0) * speed * 0.7 + drift,
      vy: (uy || 0) * speed * 0.35 + (burst ? -1.1 - Math.random() * 2.2 : -0.4 - Math.random() * 1.4),
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.28,
      life: 1,
      decay: 0.014 + Math.random() * 0.018,
      w: 2 + Math.random() * 5,
      h: 1 + Math.random() * 2.4,
      color: FLAKE_COLORS[(Math.random() * FLAKE_COLORS.length) | 0],
      kind: Math.random() < 0.1 ? "spark" : "flake",
      g: 0.2 + Math.random() * 0.1
    });
  }

  function punchPoly(ctx, poly) {
    ctx.beginPath();
    ctx.moveTo(poly[0][0], poly[0][1]);
    for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i][0], poly[i][1]);
    ctx.closePath();
    ctx.fill();
  }

  function punchGrid(pack, maskObj, tag, x, y, ux, uy, chance, allow) {
    const { grid, rows, cols } = pack;
    const r0 = Math.max(0, Math.floor((y - BRUSH) / CELL) - 1);
    const r1 = Math.min(rows - 1, Math.floor((y + BRUSH) / CELL) + 1);
    const c0 = Math.max(0, Math.floor((x - BRUSH) / CELL) - 1);
    const c1 = Math.min(cols - 1, Math.floor((x + BRUSH) / CELL) + 1);
    const R2 = BRUSH * BRUSH;

    maskObj.ctx.save();
    maskObj.ctx.globalCompositeOperation = "destination-out";
    maskObj.ctx.fillStyle = "#000";
    maskObj.ctx.globalAlpha = 1;

    for (let r = r0; r <= r1; r++) {
      for (let c = c0; c <= c1; c++) {
        const f = grid[r][c];
        if (!f.alive) continue;
        const key = tag + r + "," + c;
        if (strokeSeen.has(key)) continue;
        const dx = f.cx - x;
        const dy = f.cy - y;
        if (dx * dx + dy * dy > R2) continue;
        if (allow && !allow()) continue;
        strokeSeen.add(key);
        f.alive = false;
        pack.alive--;
        punchPoly(maskObj.ctx, f.poly);
        if (Math.random() < chance) spawn(f.cx, f.cy, ux, uy, false);
      }
    }
    maskObj.ctx.restore();
  }

  function topClearFromBefore(x, y) {
    const tr = Math.floor(y / CELL);
    const tc = Math.floor(x / CELL);
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        const rr = tr + dr;
        const cc = tc + dc;
        if (rr < 0 || cc < 0 || rr >= top.rows || cc >= top.cols) continue;
        const f = top.grid[rr][cc];
        if (f.alive) return false;
        if (strokeSeen.has("t" + rr + "," + cc)) return false;
      }
    }
    return true;
  }

  function breakAt(x, y, ux, uy) {
    punchGrid(top, maskTop, "t", x, y, ux, uy, 0.36);
    punchGrid(under, maskUnder, "u", x, y, ux, uy, 0.3, () => topClearFromBefore(x, y));
  }

  function localPos(e) {
    const r = foilEl.getBoundingClientRect();
    return {
      x: ((e.clientX - r.left) / r.width) * CARD_W,
      y: ((e.clientY - r.top) / r.height) * CARD_H
    };
  }

  function stroke(x, y) {
    const dx = lastX === null ? 0 : x - lastX;
    const dy = lastY === null ? 0 : y - lastY;
    const dist = Math.hypot(dx, dy);
    const len = dist || 1;
    const ux = dx / len;
    const uy = dy / len;

    if (lastX === null) {
      breakAt(x, y, ux, uy);
    } else {
      const steps = Math.max(1, Math.ceil(dist / 4));
      for (let i = 1; i <= steps; i++) {
        const t = i / steps;
        breakAt(lastX + dx * t, lastY + dy * t, ux, uy);
      }
    }

    didScratch = true;
    lastX = x;
    lastY = y;
  }

  function remainingRatio() {
    const tot = top.total + under.total;
    return tot ? (top.alive + under.alive) / tot : 0;
  }

  function crumblePack(pack, maskObj, chance) {
    maskObj.ctx.save();
    maskObj.ctx.globalCompositeOperation = "destination-out";
    maskObj.ctx.fillStyle = "#000";
    for (let r = 0; r < pack.rows; r++) {
      for (let c = 0; c < pack.cols; c++) {
        const f = pack.grid[r][c];
        if (!f.alive) continue;
        f.alive = false;
        punchPoly(maskObj.ctx, f.poly);
        if (Math.random() < chance) spawn(f.cx, f.cy, (Math.random() - 0.5), -0.8, true);
      }
    }
    pack.alive = 0;
    maskObj.ctx.restore();
  }

  function crumble() {
    if (crumbled) return;
    crumbled = true;
    crumblePack(top, maskTop, 0.06);
    crumblePack(under, maskUnder, 0.1);
  }

  function paintSheen(ctx, t) {
    const gx = CARD_W * (0.15 + Math.sin(t * 0.7) * 0.35);
    const g = ctx.createLinearGradient(gx - 80, 0, gx + 160, CARD_H);
    g.addColorStop(0, "rgba(255,255,255,0)");
    g.addColorStop(0.42, "rgba(176, 220, 255, 0.12)");
    g.addColorStop(0.5, "rgba(255,255,255,0.42)");
    g.addColorStop(0.58, "rgba(255, 176, 220, 0.12)");
    g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, CARD_W, CARD_H);
  }

  function drawFoil(t) {
    foilCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    foilCtx.clearRect(0, 0, CARD_W, CARD_H);
    foilCtx.globalAlpha = 0.62;
    foilCtx.globalCompositeOperation = "copy";
    foilCtx.drawImage(texture.canvas, 0, 0, CARD_W, CARD_H);
    foilCtx.globalAlpha = 1;
    foilCtx.globalCompositeOperation = "destination-in";
    foilCtx.drawImage(maskUnder.canvas, 0, 0, CARD_W, CARD_H);

    layer.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layer.ctx.globalCompositeOperation = "copy";
    layer.ctx.drawImage(texture.canvas, 0, 0, CARD_W, CARD_H);
    layer.ctx.globalCompositeOperation = "source-atop";
    paintSheen(layer.ctx, t);
    layer.ctx.globalCompositeOperation = "destination-in";
    layer.ctx.drawImage(maskTop.canvas, 0, 0, CARD_W, CARD_H);

    foilCtx.globalCompositeOperation = "source-over";
    foilCtx.drawImage(layer.canvas, 0, 0, CARD_W, CARD_H);
  }

  function drawParticles() {
    pCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    pCtx.clearRect(0, 0, FRAME_W, FRAME_H);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += p.g;
      p.vx *= 0.96;
      p.vy *= 0.988;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.life -= p.decay;
      if (p.life <= 0 || p.y > FRAME_H + 20) {
        particles.splice(i, 1);
        continue;
      }

      pCtx.save();
      pCtx.globalAlpha = Math.max(0, p.life);
      pCtx.translate(p.x, p.y);
      pCtx.rotate(p.rot);
      if (p.kind === "spark") {
        pCtx.fillStyle = "#fff";
        pCtx.fillRect(-0.7, -2.8, 1.4, 5.6);
        pCtx.fillRect(-2.8, -0.7, 5.6, 1.4);
      } else {
        pCtx.beginPath();
        pCtx.moveTo(-p.w / 2, -p.h / 2);
        pCtx.lineTo(p.w / 2, -p.h / 2 * 0.35);
        pCtx.lineTo(p.w / 2 * 0.75, p.h / 2);
        pCtx.lineTo(-p.w / 2 * 0.65, p.h / 2);
        pCtx.closePath();
        pCtx.fillStyle = p.color;
        pCtx.fill();
        pCtx.strokeStyle = "rgba(255,255,255,0.45)";
        pCtx.lineWidth = 0.4;
        pCtx.stroke();
      }
      pCtx.restore();
    }
  }

  function tick(now) {
    const t = now / 1000;
    drawFoil(t);
    drawParticles();

    if (didScratch && !crumbled) {
      checkIn++;
      if (
        checkIn % 18 === 0 &&
        top.alive / top.total < 0.2 &&
        under.alive / under.total < 0.36
      ) crumble();
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function onDown(e) {
    e.preventDefault();
    scratching = true;
    strokeSeen = new Set();
    card.setPointerCapture?.(e.pointerId);
    const { x, y } = localPos(e);
    lastX = lastY = null;
    stroke(x, y);
  }

  function onMove(e) {
    coin.style.transform = `translate(${e.clientX - 24}px, ${e.clientY - 24}px)`;
    if (!scratching) return;
    e.preventDefault();
    const { x, y } = localPos(e);
    stroke(x, y);
  }

  function onUp() {
    scratching = false;
    lastX = lastY = null;
  }

  card.addEventListener("pointerdown", onDown);
  card.addEventListener("pointermove", onMove);
  card.addEventListener("pointerup", onUp);
  card.addEventListener("pointercancel", onUp);
  card.addEventListener("pointerenter", (e) => {
    if (e.pointerType === "mouse") coin.classList.add("on");
  });
  card.addEventListener("pointerleave", () => {
    coin.classList.remove("on");
    if (!scratching) lastX = lastY = null;
  });

  window.addEventListener("pointermove", (e) => {
    if (coin.classList.contains("on") || scratching) {
      coin.style.transform = `translate(${e.clientX - 24}px, ${e.clientY - 24}px)`;
    }
  });

  function reset() {
    particles.length = 0;
    crumbled = false;
    didScratch = false;
    lastX = lastY = null;
    scratching = false;
    strokeSeen = new Set();
    resetMask();
    buildFrags();
  }

  resetBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    reset();
  });
  card.addEventListener("dblclick", reset);
})();
</script>
<script src="../shared/touch-cursor.js" data-target=".frame"></script>
</body>
</html>
