<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>first-screen-observations-typing</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#ffffff" />
<style>
  @font-face {
    font-family: "Oceanic Text Mono";
    src: url("assets/fonts/OceanicTextMono-Regular.otf") format("opentype");
    font-weight: 400;
    font-display: block;
  }
  @font-face {
    font-family: "SF Pro Text";
    src: url("assets/fonts/SFProText-Regular.otf") format("opentype");
    font-weight: 400;
    font-display: block;
  }
  @font-face {
    font-family: "SF Pro Text";
    src: url("assets/fonts/SFProText-Semibold.otf") format("opentype");
    font-weight: 590;
    font-display: block;
  }
  @font-face {
    font-family: "ABC Diatype Variable";
    src: url("assets/fonts/ABCDiatypeVariable.ttf") format("truetype");
    font-weight: 100 900;
    font-display: block;
  }

  :root {
    --w: 402px;
    --h: 874px;
    --phrase-size: 54px;
    --phrase-line: 60px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    background: #16151a;
    overflow: hidden;
    user-select: none;
    touch-action: none;
    overscroll-behavior: none;
  }
  body { display: grid; place-items: center; }

  .stage {
    position: relative;
    width: var(--w);
    height: var(--h);
    transform-origin: center center;
  }

  .frame {
    position: relative;
    width: var(--w);
    height: var(--h);
    overflow: hidden;
    background: #fff;
  }

  .screen {
    position: absolute;
    left: 0;
    top: 0;
    width: var(--w);
    height: 681px;
    color: #000;
  }
  .screen .time {
    position: absolute;
    left: 24px;
    top: 21px;
    width: 100px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: 1.5px;
    font-family: "SF Pro Text";
    font-weight: 590;
    font-size: 17px;
    line-height: 22px;
  }
  .screen .island {
    position: absolute;
    left: 139px;
    top: 14px;
    width: 124px;
    height: 36px;
    border-radius: 30.631px;
    background: #000;
  }
  .screen .levels {
    position: absolute;
    left: 278px;
    top: 21px;
    width: 100px;
    height: 22px;
  }
  .screen .levels img { display: block; width: 100px; height: 22px; }
  .screen .menu {
    position: absolute;
    left: 16px;
    top: 66px;
    width: 40px;
    height: 8px;
  }
  .screen .menu img { display: block; width: 40px; height: 8px; }

  .screen .status-row {
    position: absolute;
    left: 15px;
    top: 98px;
    height: 23px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .screen .status-row .sym { display: block; width: 17px; height: 16px; }
  .screen .status-row .txt,
  .screen .skip {
    font-family: "ABC Diatype Variable";
    font-weight: 400;
    font-size: 18px;
    line-height: 20px;
  }
  .screen .status-row .rule {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 1px;
    background: rgba(0, 0, 0, 0.29);
  }
  .screen .skip {
    position: absolute;
    left: 15px;
    top: 633px;
    height: 23px;
  }
  .screen .skip .rule {
    position: absolute;
    left: 0;
    top: 22px;
    width: 32px;
    height: 1px;
    background: rgba(0, 0, 0, 0.28);
  }

  .phrase {
    position: absolute;
    left: 14px;
    top: 141px;
    width: 374px;
    font-family: "Oceanic Text Mono";
    font-size: var(--phrase-size);
    line-height: var(--phrase-line);
  }
  .phrase .ln { height: var(--phrase-line); }
  /* the rule rides on the text itself, so it grows letter by letter with it */
  .phrase .ink {
    white-space: pre;
    text-decoration: underline;
    text-decoration-color: #e6e6e6;
    text-decoration-thickness: 1px;
    text-underline-offset: 3.5px;
    text-decoration-skip-ink: none;
  }
  .phrase .tcaret {
    position: absolute;
    left: 0;
    top: 7px;
    width: 2px;
    height: 44px;
    background: #000;
    opacity: 0;
  }
  .phrase .tcaret.on { opacity: 1; }
  .phrase .tcaret.rest { animation: blink 1.1s steps(1) infinite; }

  /* input — frame -3,681,405,203 */
  .input {
    position: absolute;
    left: -3px;
    top: 681px;
    width: 405px;
    height: 203px;
    background: #fff;
    overflow: hidden;
    z-index: 15;
  }
  .input::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 1px;
    background: #e6e6e6;
  }
  .input .placeholder {
    position: absolute;
    left: 23px;
    top: 20px;
    height: 31px;
    margin: 0;
    font-family: "Oceanic Text Mono";
    font-size: 28px;
    line-height: 31px;
    letter-spacing: -0.84px;
    color: rgba(0, 0, 0, 0.12);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 320ms ease-out;
  }
  .input .caret {
    position: absolute;
    left: 19px;
    top: 20px;
    width: 1px;
    height: 35px;
    background: #000;
    opacity: 0;
    transition: opacity 200ms ease-out;
  }
  .input.ready .placeholder { opacity: 1; }
  .input.ready .caret { opacity: 1; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .input .plus {
    position: absolute;
    left: 32px;
    top: 126px;
    width: 20px;
    height: 20px;
  }
  .input .plus img { display: block; width: 20px; height: 20px; }
  .input .ring {
    position: absolute;
    top: 113px;
    width: 46px;
    height: 46px;
  }
  .input .ring img { display: block; width: 46px; height: 46px; }
  .input .ring.l { left: 19px; }
  .input .ring.r { left: 343px; }
  .input .wave { position: absolute; display: block; }
  .input .wave img { display: block; width: 1px; height: 100%; }

  .caption {
    position: absolute;
    left: 50%;
    top: calc(100% + 18px);
    transform: translateX(-50%);
    white-space: nowrap;
    font-family: "ABC Diatype Variable", system-ui, sans-serif;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.28);
  }

  @media (max-width: 430px) {
    .caption { display: none; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="frame">
      <div class="screen">
        <div class="time">9:41</div>
        <div class="island"></div>
        <div class="levels"><img src="assets/levels-dark.svg" alt="" width="100" height="22" /></div>
        <div class="menu"><img src="assets/menu-dark.svg" alt="" width="40" height="8" /></div>
        <div class="status-row">
          <img class="sym" src="assets/hexagonpath.png" alt="" width="17" height="16" />
          <span class="txt">observations</span>
          <div class="rule"></div>
        </div>
        <div class="phrase" id="phrase" aria-label="How much is an expensive dinner?">
          <div class="ln"><span class="ink"></span></div>
          <div class="ln"><span class="ink"></span></div>
          <div class="ln"><span class="ink"></span></div>
          <div class="ln"><span class="ink"></span></div>
          <div class="tcaret" id="tcaret"></div>
        </div>
        <div class="skip">skip<div class="rule"></div></div>
      </div>

      <div class="input" id="input">
        <p class="placeholder">Type the amount</p>
        <div class="caret"></div>
        <div class="ring l"><img src="assets/circle-left.svg" alt="" width="46" height="46" /></div>
        <div class="plus"><img src="assets/plus.svg" alt="" width="20" height="20" /></div>
        <div class="ring r"><img src="assets/circle-right.svg" alt="" width="46" height="46" /></div>
        <div class="wave" style="left:356px;top:133px;height:6px"><img src="assets/wave-2.svg" alt="" /></div>
        <div class="wave" style="left:363px;top:129px;height:14px"><img src="assets/wave-1.svg" alt="" /></div>
        <div class="wave" style="left:370px;top:132px;height:8px"><img src="assets/wave-3.svg" alt="" /></div>
        <div class="wave" style="left:376px;top:134px;height:4px"><img src="assets/wave-4.svg" alt="" /></div>
      </div>
    </div>
    <div class="caption">iPhone 17 · 402 × 874 · double click to replay</div>
  </div>

<script>
(() => {
  const W = 402;
  const FRAME_H = 874;
  const LINE_H = 60;
  // the face is monospaced at exactly 0.6em, so the caret can be placed by
  // arithmetic instead of measuring the DOM on every keystroke
  const ADV = 54 * 0.6;

  const LINES = ["How much", "is an", "expensive", "dinner?"];

  const OPEN_DELAY = 620;   // the screen settles before it starts talking
  const PER_CHAR = 46;
  const JITTER = 26;
  const AFTER_SPACE = 22;
  const LINE_BREAK = 150;
  const BEFORE_ANSWER = 520; // question lands, then the input wakes up

  const stage = document.getElementById("stage");
  const phrase = document.getElementById("phrase");
  const caret = document.getElementById("tcaret");
  const input = document.getElementById("input");
  const inks = [...phrase.querySelectorAll(".ink")];

  const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function fit() {
    const pad = window.innerWidth <= 430 ? 0 : 80;
    const s = Math.min((window.innerWidth - pad) / W, (window.innerHeight - pad) / FRAME_H, 1);
    stage.style.transform = `scale(${s})`;
  }
  fit();
  window.addEventListener("resize", fit);

  function putCaret(line, col) {
    caret.style.transform = `translate(${col * ADV}px, ${line * LINE_H}px)`;
  }

  let timer = 0;
  const wait = (ms) => new Promise((r) => { timer = setTimeout(r, ms); });

  async function type() {
    for (let i = 0; i < LINES.length; i++) {
      const text = LINES[i];
      for (let c = 0; c <= text.length; c++) {
        inks[i].textContent = text.slice(0, c);
        putCaret(i, c);
        if (c === text.length) break;
        const pause = text[c] === " " ? AFTER_SPACE : PER_CHAR + Math.random() * JITTER;
        await wait(pause);
      }
      if (i < LINES.length - 1) await wait(LINE_BREAK);
    }
    caret.classList.add("rest");
    await wait(BEFORE_ANSWER);
    caret.classList.remove("on", "rest");
    input.classList.add("ready");
  }

  function reset() {
    clearTimeout(timer);
    inks.forEach((el) => { el.textContent = ""; });
    caret.className = "tcaret";
    input.classList.remove("ready");
    putCaret(0, 0);
  }

  function play() {
    reset();
    if (still) {
      inks.forEach((el, i) => { el.textContent = LINES[i]; });
      input.classList.add("ready");
      return;
    }
    caret.classList.add("on");
    timer = setTimeout(type, OPEN_DELAY);
  }

  // the face has to be loaded, otherwise the first frames type in a fallback
  // at the wrong advance and the caret drifts away from the letters
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(play);

  document.addEventListener("dblclick", play);
})();
</script>
<script src="../shared/touch-cursor.js" data-target=".frame"></script>
</body>
</html>
