<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>first-screen-emoji-swarm</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#ffffff" />
<script>
  // set before first paint so the grey take doesn't flash white
  if (new URLSearchParams(location.search).get("bg") === "grey") {
    document.documentElement.dataset.bg = "grey";
  }
</script>
<style>
  @font-face {
    font-family: "Oceanic Text Mono";
    src: url("assets/fonts/OceanicTextMono-Regular.otf") format("opentype");
    font-weight: 400;
    font-display: block;
  }
  @font-face {
    font-family: "SF Pro Text";
    src: url("assets/fonts/SFProText-Regular.otf") format("opentype");
    font-weight: 400;
    font-display: block;
  }
  @font-face {
    font-family: "SF Pro Text";
    src: url("assets/fonts/SFProText-Semibold.otf") format("opentype");
    font-weight: 590;
    font-display: block;
  }
  @font-face {
    font-family: "ABC Diatype Variable";
    src: url("assets/fonts/ABCDiatypeVariable.ttf") format("truetype");
    font-weight: 100 900;
    font-display: block;
  }

  :root {
    --w: 402px;
    --h: 874px;
    --sheet-h: 681px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    background: #16151a;
    overflow: hidden;
    user-select: none;
    touch-action: none;
    overscroll-behavior: none;
  }
  body { display: grid; place-items: center; }

  .stage {
    position: relative;
    width: var(--w);
    height: var(--h);
    transform-origin: center center;
  }

  .frame {
    position: relative;
    width: var(--w);
    height: var(--h);
    overflow: hidden;
    background: #fff;
  }
  /* second take on the sheet colour, the composer stays white either way */
  html[data-bg="grey"] .frame { background: #f5f5f5; }

  /* phrase — frame 14,125,372,487 */
  .phrase {
    position: absolute;
    left: 14px;
    top: 125px;
    width: 374px;
    height: 487px;
    z-index: 2;
  }
  .phrase p {
    position: absolute;
    left: 1px;
    top: 16px;
    width: 373px;
    margin: 0;
    font-family: "Oceanic Text Mono";
    font-size: 28px;
    line-height: 37px;
    color: #000;
  }
  .phrase .line {
    position: absolute;
    height: 1px;
    display: block;
  }
  .phrase .line img { display: block; width: 100%; height: 1px; }

  .swarm {
    position: absolute;
    left: 0;
    top: 0;
    width: var(--w);
    height: var(--sheet-h);
    display: block;
  }
  .swarm.back { z-index: 1; pointer-events: none; }
  .swarm.front { z-index: 5; }

  /* status bar — frame 0,0,402,62 */
  .chrome {
    position: absolute;
    left: 0;
    top: 0;
    width: var(--w);
    height: var(--sheet-h);
    z-index: 10;
    pointer-events: none;
  }
  .time {
    position: absolute;
    left: 24px;
    top: 21px;
    width: 100px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: 1.5px;
    font-family: "SF Pro Text";
    font-weight: 590;
    font-size: 17px;
    line-height: 22px;
    color: #000;
  }
  .levels {
    position: absolute;
    left: 278px;
    top: 21px;
    width: 100px;
    height: 22px;
  }
  .levels img { display: block; width: 100px; height: 22px; }
  .island {
    position: absolute;
    left: 139px;
    top: 14px;
    width: 124px;
    height: 36px;
    border-radius: 30.631px;
    background: #000;
  }

  /* menu icon — frame 16,69,40,5 */
  .menu {
    position: absolute;
    left: 16px;
    top: 69px;
    width: 40px;
    height: 5px;
  }
  .menu img {
    position: absolute;
    left: 0;
    top: -3px;
    width: 40px;
    height: 8px;
    display: block;
  }

  /* status — frame 15,98,126,23 */
  .status-row {
    position: absolute;
    left: 15px;
    top: 98px;
    height: 23px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: #000;
    white-space: nowrap;
  }
  .status-row .sym {
    display: block;
    width: 15px;
    height: 18px;
  }
  .status-row .txt {
    font-family: "ABC Diatype Variable";
    font-weight: 400;
    font-size: 18px;
    line-height: 20px;
  }
  .status-row .rule {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 1px;
    background: rgba(0, 0, 0, 0.3);
  }

  /* input — frame -3,681,405,203 */
  .input {
    position: absolute;
    left: -3px;
    top: 681px;
    width: 405px;
    height: 203px;
    background: #fff;
    overflow: hidden;
    z-index: 15;
  }
  .input::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 1px;
    background: #e6e6e6;
  }
  .input .placeholder {
    position: absolute;
    left: 23px;
    top: 20px;
    width: auto;
    height: 31px;
    margin: 0;
    font-family: "Oceanic Text Mono";
    font-size: 28px;
    line-height: 31px;
    letter-spacing: -0.84px;
    color: rgba(0, 0, 0, 0.12);
    white-space: nowrap;
  }
  .input .caught {
    position: absolute;
    left: 23px;
    top: 16px;
    height: 40px;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 28px;
    line-height: 40px;
    white-space: nowrap;
  }
  .input .caret {
    position: absolute;
    left: 19px;
    top: 20px;
    width: 1px;
    height: 35px;
    background: #000;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .input .plus {
    position: absolute;
    left: 32px;
    top: 126px;
    width: 20px;
    height: 20px;
  }
  .input .plus img { display: block; width: 20px; height: 20px; }
  .input .ring {
    position: absolute;
    top: 113px;
    width: 46px;
    height: 46px;
  }
  .input .ring img { display: block; width: 46px; height: 46px; }
  .input .ring.l { left: 19px; }
  .input .ring.r { left: 343px; }
  .input .wave { position: absolute; display: block; }
  .input .wave img { display: block; width: 1px; height: 100%; }

  .caption {
    position: absolute;
    left: 50%;
    top: calc(100% + 18px);
    transform: translateX(-50%);
    white-space: nowrap;
    font-family: "ABC Diatype Variable", system-ui, sans-serif;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.28);
  }

  @media (max-width: 430px) {
    .caption { display: none; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="frame">
      <canvas class="swarm back" id="swarmBack"></canvas>

      <div class="phrase" id="phrase">
        <p id="phraseText">Choose 3 emojis and I&rsquo;ll predict your next 24 hours</p>
      </div>

      <canvas class="swarm front" id="swarmFront"></canvas>

      <div class="chrome">
        <div class="time">9:41</div>
        <div class="island"></div>
        <div class="levels"><img src="assets/levels.svg" alt="" width="100" height="22" /></div>
        <div class="menu"><img src="assets/menu.svg" alt="" width="40" height="8" /></div>
        <div class="status-row">
          <img class="sym" src="assets/sparkles.png" alt="" width="15" height="18" />
          <span class="txt">Just for fun</span>
          <div class="rule"></div>
        </div>
      </div>

      <div class="input">
        <p class="placeholder" id="placeholder">Start chat</p>
        <div class="caught" id="caught"></div>
        <div class="caret"></div>
        <div class="ring l"><img src="assets/circle-left.svg" alt="" width="46" height="46" /></div>
        <div class="plus"><img src="assets/plus.svg" alt="" width="20" height="20" /></div>
        <div class="ring r"><img src="assets/circle-right.svg" alt="" width="46" height="46" /></div>
        <div class="wave" style="left:356px;top:133px;height:6px"><img src="assets/wave-2.svg" alt="" /></div>
        <div class="wave" style="left:363px;top:129px;height:14px"><img src="assets/wave-1.svg" alt="" /></div>
        <div class="wave" style="left:370px;top:132px;height:8px"><img src="assets/wave-3.svg" alt="" /></div>
        <div class="wave" style="left:376px;top:134px;height:4px"><img src="assets/wave-4.svg" alt="" /></div>
      </div>
    </div>
    <div class="caption">iPhone 17 · 402 × 874 · catch one</div>
  </div>

<script>
(() => {
  const W = 402;
  const H = 681;
  const COUNT = 92;

  const GLYPHS = (
    "😀 😄 😅 😊 🙂 😉 😢 😠 😱 🤔 😍 🤗 😴 🤒 🤠 👻 💀 👽 🤖 🙈 " +
    "🐱 🐶 🐰 🐹 🐻 🐼 🐨 🐯 🦁 🐮 🐷 🐸 🐵 🐔 🐧 🐦 🦉 🐺 🐴 🦄 " +
    "🐝 🐛 🦋 🐌 🐞 🐢 🐍 🐙 🦐 🦀 🐠 🐬 🐳 🦈 🐊 🐫 🦒 🐄 🐑 🐐 " +
    "🍎 🍏 🍊 🍋 🍌 🍉 🍇 🍓 🍒 🍑 🍍 🥝 🍅 🍆 🥕 🌽 🌰 🍯 🥐 🧀 " +
    "🍔 🍟 🍕 🌭 🌮 🍜 🍣 🍤 🍦 🍩 🍪 🎂 🍰 🍫 🍭 ☕️ 🍵 🍺 🥂 🍷 " +
    "🚗 🚕 🚙 🚌 🏎 🚓 🚑 🚒 🚚 🚜 🛴 🚲 🏍 🚨 🚡 🚋 🚂 🚀 🚁 ⛵️ " +
    "⚽️ 🏀 🏈 ⚾️ 🎾 🏐 🏉 🎱 🏓 🏸 🥊 ⛳️ 🎣 🎿 🎯 🎮 🎲 🎰 🎳 🏆 " +
    "💰 💵 💶 💷 💳 💎 ⚖️ 🔧 🔨 ⛏ ⚙️ ⛓ 🔫 💣 🔪 🚬 🏺 🧭 🔑 🗝 " +
    "📱 📲 💻 ⌨️ 🖥 🖨 💽 💾 💿 📼 📷 📸 📹 🎥 📞 ☎️ 📟 📠 📺 📻 " +
    "⏰ ⌛️ ⏳ 📡 🔋 🔌 💡 🔦 🕯 🗑 📌 📍 📎 ✂️ 📏 📐 📖 📚 📰 🏷 " +
    "♈️ ♉️ ♊️ ♋️ ♌️ ♍️ ♎️ ♏️ ♐️ ♑️ ♒️ ♓️ " +
    "🌍 🌏 🗺 🏔 🌋 🏕 🏖 🏝 🏟 🏛 🏘 🏠 🏢 🏥 🏦 🏨 🏪 🏫 🏭 🏰 " +
    "🗼 🗽 ⛪️ 🕌 ⛩ ⛲️ ⛺️ 🌁 🌃 🏙 🌅 🌉 🌑 🌓 🌕 🌗 🌙 ⭐️ 🌟 ✨ " +
    "🏧 🚻 🚼 🛂 🛄 🚸 ⚠️ 🚫 ⛔️ 📵 🚭 ❗️ ❓ 💤 💢 💥 💦 💨 🕳 🔞 " +
    "🎵 🎶 🎼 🎹 🥁 🎷 🎺 🎸 🎻 🎤 🎧 🎬 🎨 🎭 🎪 🎟 🎫 🏁 🚩 🎈"
  ).split(" ").filter(Boolean);

  const stage = document.getElementById("stage");
  const canvas = document.getElementById("swarmFront");
  const backCanvas = document.getElementById("swarmBack");
  const caughtEl = document.getElementById("caught");
  const placeholderEl = document.getElementById("placeholder");
  const dpr = Math.min(window.devicePixelRatio || 1, 3);

  const layers = [backCanvas, canvas].map((c) => {
    c.width = Math.round(W * dpr);
    c.height = Math.round(H * dpr);
    const g = c.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    // the sprites are baked large and now drawn small, so downscaling quality shows
    g.imageSmoothingQuality = "high";
    return g;
  });
  const backCtx = layers[0];
  const frontCtx = layers[1];

  let scale = 1;

  function fit() {
    const pad = window.innerWidth <= 430 ? 0 : 80;
    scale = Math.min((window.innerWidth - pad) / 402, (window.innerHeight - pad) / 874, 1);
    stage.style.transform = `scale(${scale})`;
  }
  fit();
  window.addEventListener("resize", () => {
    fit();
    drawRules();
  });

  // the copy wraps on its own, so the scribbles are measured from the
  // rendered line boxes instead of being pinned to hand-picked offsets
  const phraseEl = document.getElementById("phrase");
  const phraseText = document.getElementById("phraseText");
  const RULES = [
    "line-108.svg",
    "line-109.svg",
    "line-110.svg",
    "line-111.svg",
    "line-113.svg",
    "line-114.svg"
  ];

  function drawRules() {
    phraseEl.querySelectorAll(".line").forEach((n) => n.remove());

    const range = document.createRange();
    range.selectNodeContents(phraseText);
    const base = phraseEl.getBoundingClientRect();
    const rects = Array.from(range.getClientRects()).filter((r) => r.width > 1);

    // a line box is taller than the glyphs, so the scribble is hung off the
    // baseline rather than off the bottom of the box — otherwise it drifts
    // away from the text as soon as the leading changes
    const cs = getComputedStyle(phraseText);
    const fontSize = parseFloat(cs.fontSize);
    const lineHeight = parseFloat(cs.lineHeight) || fontSize;
    const probe = document.createElement("canvas").getContext("2d");
    probe.font = `${cs.fontSize} ${cs.fontFamily}`;
    const m = probe.measureText("Hxg");
    const ascent = m.fontBoundingBoxAscent || fontSize * 0.8;
    const descent = m.fontBoundingBoxDescent || fontSize * 0.2;
    const halfLeading = (lineHeight - (ascent + descent)) / 2;
    const toBaseline = halfLeading + ascent + fontSize * 0.07;

    rects.forEach((r, i) => {
      const el = document.createElement("div");
      el.className = "line";
      el.style.left = (r.left - base.left) / scale + "px";
      el.style.top = (r.top - base.top) / scale + toBaseline + "px";
      el.style.width = r.width / scale + "px";
      const img = document.createElement("img");
      img.src = "assets/" + RULES[i % RULES.length];
      img.alt = "";
      el.appendChild(img);
      phraseEl.appendChild(el);
    });
  }

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(drawRules);
  } else {
    drawRules();
  }

  // emoji glyphs are expensive to rasterise, so each one is baked once
  const SPRITE = 96;
  const sprites = new Map();

  function sprite(ch) {
    let s = sprites.get(ch);
    if (s) return s;
    const c = document.createElement("canvas");
    c.width = SPRITE;
    c.height = SPRITE;
    const g = c.getContext("2d");
    g.font = `${SPRITE - 16}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.fillText(ch, SPRITE / 2, SPRITE / 2 + 2);
    sprites.set(ch, c);
    return c;
  }

  const rand = (a, b) => a + Math.random() * (b - a);

  function spawn(edge) {
    // depth drives size, speed and layer together, so the far glyphs
    // read as a slower backdrop behind the note
    const depth = Math.random();
    const size = 12.7 + Math.pow(depth, 1.4) * 39.6 + rand(-2.6, 2.6);
    const speed = 38.4 + depth * 64.8;
    // one shared current running down and to the left
    const angle = Math.PI + rand(-0.3, 0.3) - 0.78;
    const p = {
      ch: GLYPHS[(Math.random() * GLYPHS.length) | 0],
      size,
      back: depth < 0.45,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      bob: rand(0, Math.PI * 2),
      bobRate: rand(0.5, 1.4),
      held: false,
      x: 0,
      y: 0
    };
    if (edge) {
      // re-enter from the edges the current comes from, never the ones it exits
      if (Math.random() < 0.5) {
        p.x = W + size;
        p.y = rand(-size, H + size);
      } else {
        p.x = rand(-size, W + size);
        p.y = -size;
      }
    } else {
      p.x = rand(0, W);
      p.y = rand(0, H);
    }
    return p;
  }

  const swarm = [];
  for (let i = 0; i < COUNT; i++) swarm.push(spawn(false));

  const held = [];

  function syncCaught() {
    caughtEl.textContent = held.map((p) => p.ch).join("");
    placeholderEl.style.display = held.length ? "none" : "";
  }

  let last = performance.now();

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    backCtx.clearRect(0, 0, W, H);
    frontCtx.clearRect(0, 0, W, H);

    for (let i = 0; i < swarm.length; i++) {
      const p = swarm[i];
      if (!p.held) {
        p.bob += p.bobRate * dt;
        p.x += p.vx * dt;
        p.y += (p.vy + Math.sin(p.bob) * 4) * dt;
        const m = p.size;
        if (p.x < -m || p.y < -m || p.x > W + m || p.y > H + m) {
          swarm[i] = spawn(true);
          continue;
        }
      }
      const s = p.held ? p.size * 1.18 : p.size;
      // a caught glyph always comes forward, so it can't hide behind the text
      const ctx = p.back && !p.held ? backCtx : frontCtx;
      ctx.drawImage(sprite(p.ch), p.x - s / 2, p.y - s / 2, s, s);
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function local(e) {
    const r = canvas.getBoundingClientRect();
    return {
      x: ((e.clientX - r.left) / r.width) * W,
      y: ((e.clientY - r.top) / r.height) * H
    };
  }

  function nearest(x, y, wantBack) {
    let best = null;
    let bestD = Infinity;
    for (let i = swarm.length - 1; i >= 0; i--) {
      const p = swarm[i];
      if (!!p.back !== wantBack || p.held) continue;
      const d = Math.hypot(p.x - x, p.y - y);
      const reach = Math.max(18, p.size * 0.62);
      if (d < reach && d < bestD) {
        best = p;
        bestD = d;
      }
    }
    return best;
  }

  function pick(x, y) {
    // already-caught glyphs sit on top of everything, so they answer first
    for (let i = swarm.length - 1; i >= 0; i--) {
      const p = swarm[i];
      if (!p.held) continue;
      if (Math.hypot(p.x - x, p.y - y) < Math.max(18, p.size * 0.7)) return p;
    }
    return nearest(x, y, false) || nearest(x, y, true);
  }

  const drags = new Map();

  canvas.addEventListener("pointerdown", (e) => {
    const p = local(e);
    const hit = pick(p.x, p.y);
    if (!hit) return;
    e.preventDefault();
    canvas.setPointerCapture?.(e.pointerId);

    if (hit.held) {
      // a second tap lets it go back into the stream
      hit.held = false;
      held.splice(held.indexOf(hit), 1);
      syncCaught();
      return;
    }

    hit.held = true;
    held.push(hit);
    syncCaught();
    drags.set(e.pointerId, { p: hit, dx: hit.x - p.x, dy: hit.y - p.y });
  });

  canvas.addEventListener("pointermove", (e) => {
    const d = drags.get(e.pointerId);
    if (!d) return;
    e.preventDefault();
    const p = local(e);
    d.p.x = p.x + d.dx;
    d.p.y = p.y + d.dy;
  });

  function end(e) {
    drags.delete(e.pointerId);
  }
  canvas.addEventListener("pointerup", end);
  canvas.addEventListener("pointercancel", end);
})();
</script>
<script src="../shared/touch-cursor.js" data-target=".frame"></script>
</body>
</html>
